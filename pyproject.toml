[project]
name = "time-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pendulum>=3.2.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[project.scripts]
tt = "timetracker.cli:app"

[project.optional-dependencies]
pdf = [
    "typst>=0.15.0",
]
xlsx = [
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetracker"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "time-machine>=3.5.0",
    # The optional output formats, so tests can exercise them
    "openpyxl>=3.1.5",
    "typst>=0.15.0",
]
