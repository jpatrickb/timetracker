[project]
name = "time-tracker"
version = "0.1.0"
description = "Track billable time from the terminal and turn it into invoices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Patrick Beal" }]
dependencies = [
    "openpyxl>=3.1.5",
    "pendulum>=3.2.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "typer>=0.27.2",
    "typst>=0.15.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[project.scripts]
tt = "timetracker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetracker"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "time-machine>=3.5.0",
]
